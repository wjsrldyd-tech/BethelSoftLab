<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>달력 - BethelSoftLab</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/calendar.css" />
  </head>
  <body>
    <div class="cal-wrapper">

      <!-- 컨트롤 바 (인쇄 시 숨김) -->
      <div class="cal-controls no-print">
        <a href="tools.html" class="back-link">← 툴로</a>

        <div class="cal-nav">
          <button id="btn-prev" class="cal-nav-btn" aria-label="이전 달">&#8249;</button>
          <span id="cal-nav-label" class="cal-nav-label"></span>
          <button id="btn-next" class="cal-nav-btn" aria-label="다음 달">&#8250;</button>
        </div>

        <div class="cal-actions">
          <button id="btn-holiday" class="cal-holiday-btn">📌 휴일</button>
          <button id="btn-print" class="cal-print-btn">🖨 인쇄</button>
        </div>
      </div>

      <!-- A4 가로 미리보기 시트 -->
      <div class="cal-sheet">
        <h1 id="cal-month-title" class="cal-month-title"></h1>
        <div id="cal-day-headers" class="cal-day-headers"></div>
        <div id="cal-dates" class="cal-dates"></div>
      </div>

    </div>

    <!-- 휴일 설정 패널 (인쇄 시 숨김) -->
    <div id="holiday-overlay" class="holiday-overlay no-print"></div>
    <aside id="holiday-panel" class="holiday-panel no-print" aria-label="휴일 설정">
      <div class="hp-header">
        <span class="hp-title">📌 휴일 설정</span>
        <button id="btn-holiday-close" class="hp-close" aria-label="닫기">✕</button>
      </div>
      <p class="hp-desc">달력에 표시할 추가 휴일을 등록합니다.<br>인쇄 시에도 동일하게 반영됩니다.</p>

      <div class="hp-form">
        <input type="date" id="hp-date" class="hp-input" />
        <input type="text" id="hp-name" class="hp-input" placeholder="이름 (예: 여름방학)" maxlength="20" />
        <div class="hp-form-footer">
          <span id="hp-msg" class="hp-msg"></span>
          <button id="btn-hp-add" class="hp-add-btn">추가</button>
        </div>
      </div>

      <div class="hp-divider"></div>
      <div id="hp-list" class="hp-list"></div>
    </aside>

    <!-- Supabase SDK → config → sync → 달력 순으로 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-sync.js"></script>
    <script src="js/calendar.js"></script>
  </body>
</html>
