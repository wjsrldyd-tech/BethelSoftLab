<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대항해시대 오리진 - 교역소 타이머 - BethelSoftLab</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .ot-page {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        padding: var(--page-padding-y) var(--page-padding-x);
        gap: 1.25rem;
        width: 100%;
      }

      .ot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        width: 100%;
        flex-wrap: wrap;
      }

      .ot-title {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 600;
        color: var(--text-h);
      }

      .ot-sub {
        margin: 0.25rem 0 0;
        font-size: 0.88rem;
        color: var(--text);
      }

      .ot-status {
        min-height: 1.25rem;
        font-size: 0.85rem;
        color: var(--text);
      }

      .ot-status.is-error {
        color: #f87171;
      }

      .ot-toolbar {
        display: flex;
        align-items: flex-end;
        gap: 0.6rem;
        flex-wrap: wrap;
        padding: 0.85rem 1rem;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .ot-toolbar .ot-field {
        flex: 1 1 12rem;
        min-width: 10rem;
        margin: 0;
      }

      .ot-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .ot-empty {
        margin: 0;
        padding: 2rem;
        text-align: center;
        color: var(--text);
        border: 1px dashed var(--border);
        border-radius: 12px;
      }

      .ot-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.25rem 1.4rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .ot-card.is-ready {
        border-color: var(--origin);
        box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.25);
      }

      .ot-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .ot-port-name {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-h);
      }

      .ot-badge {
        font-size: 0.75rem;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        border: 1px solid rgba(14, 165, 233, 0.35);
        background: rgba(14, 165, 233, 0.12);
        color: #7dd3fc;
        white-space: nowrap;
      }

      .ot-card.is-ready .ot-badge {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
      }

      .ot-countdown-row {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        flex-wrap: wrap;
      }

      .ot-countdown {
        font-size: 2.6rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        color: var(--text-h);
        line-height: 1;
        min-width: 5.5rem;
      }

      .ot-card.is-ready .ot-countdown {
        color: #86efac;
      }

      .ot-meta {
        font-size: 0.9rem;
        color: var(--text);
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .ot-meta strong {
        color: var(--text-h);
        font-weight: 600;
      }

      .ot-hint {
        font-size: 0.8rem;
        opacity: 0.85;
      }

      .ot-field {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .ot-label {
        font-size: 0.78rem;
        color: var(--text);
        font-weight: 500;
      }

      .ot-field-row {
        display: flex;
        gap: 0.45rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .ot-input {
        flex: 1 1 14rem;
        min-width: 12rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-h);
        font-size: 0.95rem;
        font-family: inherit;
        padding: 0.55rem 0.75rem;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .ot-input:focus {
        border-color: var(--origin);
        box-shadow: 0 0 0 3px var(--origin-glow);
      }

      .ot-input-remaining {
        flex: 0 0 auto;
        width: 5.5rem;
        min-width: 5.5rem;
        text-align: center;
        font-size: 1.15rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      .ot-field-hint {
        font-size: 0.74rem;
        color: var(--text);
        opacity: 0.8;
      }

      .ot-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .ot-btn {
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }

      .ot-btn:hover {
        background: var(--bg-card-hover);
      }

      .ot-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .ot-btn-primary {
        border-color: var(--origin);
        color: #7dd3fc;
      }

      .ot-btn-primary:hover {
        background: rgba(14, 165, 233, 0.12);
      }

      .ot-btn-accent {
        border-color: #f59e0b;
        color: #fcd34d;
      }

      .ot-btn-accent:hover {
        background: rgba(245, 158, 11, 0.12);
      }

      .ot-btn-danger {
        border-color: rgba(248, 113, 113, 0.45);
        color: #fca5a5;
        margin-left: auto;
      }

      .ot-btn-danger:hover {
        background: rgba(248, 113, 113, 0.1);
      }

      .ot-btn-ghost {
        color: var(--text);
      }

      @media (max-width: 560px) {
        .ot-countdown { font-size: 2.1rem; }
        .ot-btn-danger { margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <div class="ot-page">
      <header class="ot-header">
        <div>
          <a href="game.html" class="back-link">← 게임으로</a>
          <h1 class="ot-title" style="margin-top: 0.85rem;">교역소 타이머</h1>
          <p class="ot-sub">대항해시대 오리진 · 재고 30분 리셋 · 남은 시간으로 맞추기</p>
        </div>
      </header>

      <p id="ot-status" class="ot-status" aria-live="polite"></p>

      <div class="ot-toolbar">
        <div class="ot-field">
          <label class="ot-label" for="ot-port-name">항구 추가</label>
          <input id="ot-port-name" class="ot-input" type="text" placeholder="예: 리스본" maxlength="40" />
        </div>
        <button type="button" id="ot-add-btn" class="ot-btn ot-btn-primary">지금 입장</button>
      </div>

      <div id="ot-list" class="ot-list" aria-label="교역소 목록"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/origin-db.js"></script>
    <script src="js/origin-timer.js"></script>
  </body>
</html>
