<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대항오 헬퍼 · 오리진 - BethelSoftLab</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .ot-app {
        height: 100svh;
        display: flex;
        flex-direction: column;
        background: #000;
      }

      /* ===== 상단 메뉴 ===== */
      .ot-toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.55rem 0.85rem;
        border-bottom: 1px solid var(--border);
        background: #0c0c10;
        z-index: 20;
        min-height: 48px;
        flex-wrap: wrap;
      }

      .ot-toolbar .back-link {
        flex-shrink: 0;
        padding: 0.35rem 0.65rem;
        font-size: 0.82rem;
      }

      .ot-toolbar-title {
        flex-shrink: 0;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-h);
        white-space: nowrap;
      }

      .ot-view-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        flex: 1 1 auto;
        min-width: 0;
      }

      .ot-view-tab {
        padding: 0.32rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text);
        font-size: 0.76rem;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
      }

      .ot-view-tab:hover {
        background: var(--bg-card-hover);
        color: var(--text-h);
      }

      .ot-view-tab.is-active {
        border-color: var(--origin);
        color: #7dd3fc;
        background: rgba(14, 165, 233, 0.12);
      }

      .ot-view-tab.has-goods {
        border-color: rgba(250, 204, 21, 0.55);
        color: #fde68a;
        background: rgba(250, 204, 21, 0.1);
      }

      .ot-view-tab.has-goods.is-active {
        border-color: #facc15;
        color: #fef08a;
        background: rgba(250, 204, 21, 0.16);
      }

      .ot-view-tab.is-dim {
        opacity: 0.45;
      }

      /* ===== 좌우 본문 =====
         맵 비율(~1024/673)에 맞는 가로폭만 오른쪽에 주고, 남은 폭은 왼쪽으로 */
      .ot-main {
        --ot-map-ar: 1.522;
        --ot-toolbar-h: 3.25rem;
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns:
          minmax(320px, 1fr)
          minmax(280px, calc((100svh - var(--ot-toolbar-h)) * var(--ot-map-ar)));
      }

      @media (max-width: 860px) {
        .ot-main {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(220px, 38%) 1fr;
        }
      }

      /* ===== 왼쪽 정보 ===== */
      .ot-side {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        min-height: 0;
        padding: 0.75rem;
        border-right: 1px solid var(--border);
        background: #0a0a0e;
        overflow: auto;
      }

      /* ===== 교역품 분류 ===== */
      .ot-goods-section {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        flex-shrink: 0;
      }

      .ot-goods-section-label {
        margin: 0;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.9);
      }

      .ot-goods-cats {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .ot-goods-cats-special {
        display: flex;
        flex-wrap: wrap;
        gap: 0.32rem;
        align-items: center;
      }

      .ot-goods-cats-normal {
        display: flex;
        flex-direction: column;
        gap: 0.28rem;
      }

      .ot-goods-cat-row {
        display: grid;
        grid-template-columns: 3.1rem repeat(5, minmax(0, 1fr));
        gap: 0.28rem;
        align-items: stretch;
      }

      .ot-goods-cat-label {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0.15rem 0.1rem;
        border-radius: 7px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(30, 41, 59, 0.65);
        color: #94a3b8;
        font-size: 0.7rem;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.02em;
        white-space: pre-line;
        user-select: none;
      }

      .ot-goods-cats-normal .ot-cat-btn {
        width: 100%;
        min-width: 0;
        padding: 0.48rem 0.2rem;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ot-cat-clear {
        margin-left: auto;
        border-color: rgba(148, 163, 184, 0.28);
        color: #94a3b8;
      }

      .ot-cat-clear:hover:not(:disabled) {
        border-color: rgba(248, 113, 113, 0.45);
        background: rgba(248, 113, 113, 0.1);
        color: #fecaca;
      }

      .ot-cat-clear:disabled,
      .ot-cat-clear.is-dim {
        opacity: 0.45;
        cursor: default;
      }

      .ot-goods-cats-divider {
        height: 1px;
        margin: 0.05rem 0;
        background: linear-gradient(90deg,
          transparent,
          rgba(148, 163, 184, 0.35) 12%,
          rgba(148, 163, 184, 0.35) 88%,
          transparent);
      }

      .ot-cat-btn {
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(15, 23, 42, 0.85);
        color: #cbd5e1;
        font-size: 0.98rem;
        font-weight: 560;
        font-family: inherit;
        cursor: pointer;
        line-height: 1.25;
        transition: border-color 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
      }

      .ot-cat-btn:hover {
        border-color: rgba(14, 165, 233, 0.45);
        color: #e2e8f0;
        background: rgba(14, 165, 233, 0.08);
      }

      .ot-cat-btn.is-active {
        border-color: rgba(14, 165, 233, 0.65);
        background: linear-gradient(160deg, rgba(14, 165, 233, 0.28), rgba(2, 132, 199, 0.16));
        color: #e0f2fe;
        box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.2), 0 4px 14px rgba(14, 165, 233, 0.12);
      }

      .ot-goods-cats-special .ot-cat-btn:not(.ot-cat-clear) {
        border-color: rgba(250, 204, 21, 0.35);
        color: #fde68a;
      }

      .ot-goods-cats-special .ot-cat-btn:not(.ot-cat-clear):hover {
        border-color: rgba(250, 204, 21, 0.55);
        background: rgba(250, 204, 21, 0.1);
        color: #fef08a;
      }

      .ot-goods-cats-special .ot-cat-btn:not(.ot-cat-clear).is-active {
        border-color: rgba(250, 204, 21, 0.7);
        background: linear-gradient(160deg, rgba(250, 204, 21, 0.28), rgba(202, 138, 4, 0.18));
        color: #fef9c3;
        box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.25), 0 4px 14px rgba(250, 204, 21, 0.12);
      }

      .ot-panel {
        flex-shrink: 0;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.95rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .ot-panel.is-ready {
        border-color: var(--origin);
        box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.25);
      }

      .ot-panel.is-sold-out {
        border-color: rgba(251, 146, 60, 0.45);
        box-shadow: 0 0 0 1px rgba(251, 146, 60, 0.2);
      }

      .ot-panel-empty {
        margin: 0;
        color: var(--text);
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .ot-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .ot-head-actions {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        flex-shrink: 0;
      }

      .ot-head-actions .ot-btn {
        padding: 0.28rem 0.55rem;
        font-size: 0.74rem;
      }

      .ot-head-actions .ot-btn-danger {
        margin-left: 0;
      }

      .ot-port-name {
        margin: 0;
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        min-width: 0;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-h);
      }

      .ot-month-wrap {
        flex-shrink: 0;
        display: inline-flex;
        align-items: baseline;
        margin: 0;
        cursor: pointer;
      }

      .ot-month-select {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        padding: 0.1rem 1.1rem 0.1rem 0.15rem;
        border: 1px solid transparent;
        border-radius: 6px;
        background:
          linear-gradient(45deg, transparent 50%, #7dd3fc 50%) calc(100% - 0.55rem) calc(50% - 0.12rem) / 0.35rem 0.35rem no-repeat,
          linear-gradient(135deg, #7dd3fc 50%, transparent 50%) calc(100% - 0.32rem) calc(50% - 0.12rem) / 0.35rem 0.35rem no-repeat,
          transparent;
        color: #7dd3fc;
        font-size: 1.55rem;
        font-weight: 700;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        line-height: 1.15;
        cursor: pointer;
        outline: none;
        max-width: none;
        width: 4.85rem;
        min-width: 4.85rem;
        color-scheme: dark;
      }

      .ot-month-select:hover {
        border-color: rgba(14, 165, 233, 0.4);
        background-color: rgba(14, 165, 233, 0.1);
      }

      .ot-month-select:focus {
        border-color: var(--origin);
        box-shadow: 0 0 0 3px var(--origin-glow);
        background-color: rgba(14, 165, 233, 0.12);
      }

      .ot-month-select option {
        font-size: 0.95rem;
        font-weight: 600;
        background: #0c0c10;
        color: #e2e8f0;
      }

      .ot-month {
        flex-shrink: 0;
        font-size: 1.55rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        color: #7dd3fc;
        line-height: 1;
      }

      .ot-month-sep {
        flex-shrink: 0;
        font-size: 1.25rem;
        font-weight: 400;
        color: rgba(148, 163, 184, 0.55);
        line-height: 1;
      }

      .ot-port-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-h);
        line-height: 1.2;
      }

      .ot-season {
        flex-shrink: 0;
        margin-left: 0.15rem;
        font-size: 0.72rem;
        font-weight: 550;
        letter-spacing: 0.02em;
        color: rgba(148, 163, 184, 0.95);
        white-space: nowrap;
        line-height: 1.2;
      }

      .ot-badge {
        font-size: 0.72rem;
        padding: 0.15rem 0.45rem;
        border-radius: 999px;
        border: 1px solid rgba(14, 165, 233, 0.35);
        background: rgba(14, 165, 233, 0.12);
        color: #7dd3fc;
        white-space: nowrap;
      }

      .ot-panel.is-ready .ot-badge {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
      }

      .ot-panel.is-sold-out .ot-badge {
        border-color: rgba(251, 146, 60, 0.45);
        background: rgba(251, 146, 60, 0.14);
        color: #fdba74;
      }

      .ot-countdown-row {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .ot-countdown {
        font-size: 2.2rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        color: var(--text-h);
        line-height: 1;
        min-width: 5rem;
        flex-shrink: 0;
      }

      .ot-countdown-row .ot-min-row {
        margin-left: auto;
        flex-shrink: 0;
        align-self: center;
      }

      .ot-panel.is-ready .ot-countdown { color: #86efac; }

      .ot-synced-at {
        margin: 0;
        flex: 1 1 8rem;
        min-width: 0;
        font-size: 0.72rem;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        opacity: 0.88;
        padding-bottom: 0.12em;
      }

      .ot-meta {
        font-size: 0.84rem;
        color: var(--text);
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .ot-meta strong { color: var(--text-h); font-weight: 600; }
      .ot-hint { font-size: 0.74rem; opacity: 0.85; }

      .ot-field { display: flex; flex-direction: column; gap: 0.3rem; }

      .ot-label {
        font-size: 0.74rem;
        color: var(--text);
        font-weight: 500;
      }

      .ot-remain-edit {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      .ot-min-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .ot-select {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-h);
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        padding: 0.4rem 0.55rem;
        outline: none;
        min-width: 4.5rem;
        color-scheme: dark;
      }

      .ot-select option {
        background: #0c0c10;
        color: #e2e8f0;
      }

      .ot-select:focus {
        border-color: var(--origin);
        box-shadow: 0 0 0 3px var(--origin-glow);
      }

      .ot-sec-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 0.25rem;
      }

      .ot-sec-btn {
        padding: 0.4rem 0.05rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        font-size: 0.78rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        font-family: inherit;
        cursor: pointer;
        line-height: 1.1;
      }

      .ot-sec-btn:hover {
        border-color: var(--origin);
        color: #fff;
      }

      .ot-sec-btn:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .ot-actions {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin-top: 0.15rem;
      }

      .ot-actions-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        width: 100%;
      }

      .ot-btn {
        padding: 0.42rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        font-size: 0.82rem;
        font-family: inherit;
        cursor: pointer;
      }

      .ot-btn:hover { background: var(--bg-card-hover); }
      .ot-btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .ot-btn-primary { border-color: var(--origin); color: #7dd3fc; }
      .ot-btn-primary:hover { background: rgba(14, 165, 233, 0.12); }
      .ot-btn-accent { border-color: #f59e0b; color: #fcd34d; }
      .ot-btn-accent:hover { background: rgba(245, 158, 11, 0.12); }
      .ot-btn-enter,
      .ot-btn-visit,
      .ot-btn-tool {
        width: 100%;
        padding: 0.85rem 1rem;
        font-size: 1.05rem;
        font-weight: 650;
        letter-spacing: 0.06em;
        border-radius: 10px;
      }
      .ot-btn-enter {
        border-color: var(--origin);
        color: #7dd3fc;
      }
      .ot-btn-enter:hover { background: rgba(14, 165, 233, 0.12); }
      .ot-btn-visit {
        border-color: #fb923c;
        color: #fdba74;
      }
      .ot-btn-visit:hover { background: rgba(251, 146, 60, 0.12); }
      .ot-btn-visit.is-on {
        background: rgba(251, 146, 60, 0.22);
        border-color: #fb923c;
        color: #ffedd5;
        box-shadow: inset 0 0 0 1px rgba(251, 146, 60, 0.35);
      }
      .ot-btn-visit.is-on:hover { background: rgba(251, 146, 60, 0.3); }
      .ot-btn-tool {
        border-color: #a78bfa;
        color: #c4b5fd;
      }
      .ot-btn-tool:hover { background: rgba(167, 139, 250, 0.12); }
      .ot-btn-tool.is-on {
        background: rgba(167, 139, 250, 0.22);
        border-color: #a78bfa;
        color: #ede9fe;
        box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.35);
      }
      .ot-btn-tool.is-on:hover { background: rgba(167, 139, 250, 0.3); }
      .ot-btn-danger { border-color: rgba(248, 113, 113, 0.45); color: #fca5a5; }
      .ot-btn-danger:hover { background: rgba(248, 113, 113, 0.1); }
      .ot-btn-ghost { color: var(--text); }

      .ot-panel.is-untracked .ot-countdown {
        color: var(--text);
        opacity: 0.55;
      }

      .ot-panel.is-untracked .ot-synced-at {
        opacity: 0.55;
      }

      /* ===== 오른쪽 지도 ===== */
      .ot-map-pane {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: #12151c;
      }

      .ot-map {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0c10;
        overflow: hidden;
        container-type: size;
        touch-action: none;
        user-select: none;
      }

      .ot-map-canvas {
        position: relative;
        width: 100%;
        height: 100%;
        background: #12151c;
        overflow: visible;
      }

      .ot-map.has-image .ot-map-canvas {
        flex: 0 1 auto;
        width: min(100%, calc(100cqh * var(--map-ar, 1.7)));
        height: min(100%, calc(100cqw / var(--map-ar, 1.7)));
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: var(--map-ar, 16 / 9);
        background-color: #1a2030;
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.45);
      }

      .ot-map-label {
        position: absolute;
        top: 0.65rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: 0.72rem;
        font-weight: 600;
        color: rgba(226, 232, 240, 0.85);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        background: rgba(10, 12, 16, 0.55);
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
      }

      .ot-pin {
        position: absolute;
        transform: translate(-50%, -100%);
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        font-family: inherit;
        color: inherit;
      }

      .ot-pin-marker {
        width: 12px;
        height: 12px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        background: #94a3b8;
        border: 2px solid #e2e8f0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      .ot-pin.is-tracked .ot-pin-marker {
        background: #0ea5e9;
        border-color: #7dd3fc;
      }

      .ot-pin.is-ready .ot-pin-marker {
        background: #22c55e;
        border-color: #86efac;
      }

      .ot-pin.is-sold-out .ot-pin-marker {
        background: #fb923c;
        border-color: #fdba74;
      }

      /* 도구점 구매: 핀 → 더 큰 둥근 네모 (구분용) */
      .ot-pin.is-tool-shop .ot-pin-marker {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        transform: none;
      }

      .ot-pin.is-active .ot-pin-marker {
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.5);
      }

      .ot-pin-name {
        margin-top: 3px;
        font-size: 0.95rem;
        font-weight: 650;
        color: #f5f5f7;
        white-space: nowrap;
        background: #1a1c24;
        padding: 0.2rem 0.5rem;
        border-radius: 5px;
        border: 1px solid #3a3a44;
      }

      .ot-pin-time {
        font-size: 0.84rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #7dd3fc;
        background: #1a1c24;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        border: 1px solid #2a2a32;
      }

      .ot-pin.is-ready .ot-pin-time { color: #86efac; }
      .ot-pin.is-sold-out .ot-pin-time { color: #fdba74; }
      .ot-pin:hover .ot-pin-name { border-color: var(--origin); color: #fff; }

      /* 분류 필터 ON — 이름|타이머 + 아래 품목 */
      .ot-map.is-goods-filter .ot-pin.is-goods-focus {
        z-index: 8;
        gap: 0.2rem;
      }

      .ot-map.is-goods-filter .ot-pin-marker {
        width: 14px;
        height: 14px;
        background: #0ea5e9;
        border-color: #7dd3fc;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.35), 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .ot-map.is-goods-filter .ot-pin.is-ready .ot-pin-marker {
        background: #22c55e;
        border-color: #86efac;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35), 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .ot-map.is-goods-filter .ot-pin.is-tool-shop .ot-pin-marker {
        width: 18px;
        height: 18px;
        border-radius: 3px;
        transform: none;
      }

      .ot-pin-head {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 0.25rem;
        max-width: 11rem;
      }

      .ot-map.is-goods-filter .ot-pin-name {
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.12rem 0.4rem;
        background: rgba(15, 18, 24, 0.92);
        border-color: rgba(14, 165, 233, 0.45);
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ot-map.is-goods-filter .ot-pin-time {
        font-size: 0.74rem;
        padding: 0.1rem 0.35rem;
        flex-shrink: 0;
      }

      .ot-pin-goods {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.12rem;
        min-width: 0;
        margin-top: 0.05rem;
      }

      .ot-pin-good {
        font-size: 0.76rem;
        font-weight: 550;
        line-height: 1.2;
        text-align: center;
        white-space: nowrap;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(30, 41, 59, 0.75);
        color: #cbd5e1;
        box-shadow: none;
      }

      .ot-pin-good-qty {
        margin-left: 0.28rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #7dd3fc;
      }

      .ot-pin-good.is-specialty .ot-pin-good-qty {
        color: #422006;
      }

      .ot-pin-good.is-specialty {
        background: #facc15;
        border-color: rgba(202, 138, 4, 0.55);
        color: #422006;
        font-weight: 700;
      }

      .ot-map.is-edit-mode .ot-pin {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .ot-map.is-edit-mode .ot-pin.is-dragging {
        cursor: grabbing;
        z-index: 20;
        opacity: 0.92;
      }

      .ot-map.is-edit-mode .ot-pin.is-dragging .ot-pin-name {
        border-color: #f59e0b;
        color: #fef3c7;
      }

      .ot-edit-hint {
        display: none;
        position: absolute;
        bottom: 0.7rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9;
        padding: 0.4rem 0.85rem;
        border-radius: 6px;
        border: 1px solid rgba(245, 158, 11, 0.45);
        background: rgba(30, 24, 12, 0.92);
        color: #fbbf24;
        font-size: 0.8rem;
        font-weight: 600;
        pointer-events: none;
        white-space: nowrap;
      }

      .ot-map-pane.is-edit-mode .ot-edit-hint { display: block; }

      .ot-edit-controls {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-left: auto;
        flex-shrink: 0;
      }

      .ot-edit-btn {
        padding: 0.35rem 0.7rem;
        font-size: 0.8rem;
        font-weight: 600;
        font-family: inherit;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-h);
        cursor: pointer;
      }

      .ot-edit-btn:hover {
        border-color: var(--origin);
        background: rgba(14, 165, 233, 0.1);
      }

      .ot-edit-btn.is-active {
        border-color: #f59e0b;
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
      }

      .ot-edit-btn-save {
        border-color: rgba(34, 197, 94, 0.45);
        color: #86efac;
      }

      .ot-edit-btn-cancel {
        border-color: rgba(248, 113, 113, 0.4);
        color: #fca5a5;
      }

      .ot-edit-btn[hidden] { display: none; }

      /* ===== 교역품 / 물물교환 탭 ===== */
      .ot-side-tools {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        flex: 1 1 auto;
        min-height: 0;
      }

      .ot-side-tool-tabs {
        display: flex;
        gap: 0.25rem;
        padding: 0.2rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        flex-shrink: 0;
      }

      .ot-side-tool-tab {
        flex: 1 1 0;
        padding: 0.55rem 0.45rem;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-size: 1.05rem;
        font-weight: 560;
        font-family: inherit;
        cursor: pointer;
      }

      .ot-side-tool-tab:hover {
        color: var(--text-h);
        background: rgba(255, 255, 255, 0.05);
      }

      .ot-side-tool-tab.is-active {
        background: rgba(14, 165, 233, 0.18);
        color: #7dd3fc;
        font-weight: 600;
      }

      .ot-side-tool-pane[hidden] {
        display: none !important;
      }

      .ot-side-tool-pane {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        flex: 1 1 auto;
        min-height: 0;
      }

      /* ===== 물물교환 패널 ===== */
      .ot-barter-panel {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .ot-barter-section {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .ot-barter-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
        gap: 0.55rem;
        align-items: end;
      }

      .ot-barter-row-top {
        grid-template-columns:
          minmax(4.5rem, 0.7fr)
          minmax(6.5rem, 1.15fr)
          minmax(5.5rem, 1fr);
      }

      .ot-barter-field-capacity .ot-barter-input {
        font-variant-numeric: tabular-nums;
      }

      .ot-barter-field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }

      .ot-barter-label {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(203, 213, 225, 0.95);
      }

      .ot-barter-input,
      .ot-barter-cell-input,
      .ot-qty-input {
        -moz-appearance: textfield;
      }

      .ot-barter-input::-webkit-outer-spin-button,
      .ot-barter-input::-webkit-inner-spin-button,
      .ot-barter-cell-input::-webkit-outer-spin-button,
      .ot-barter-cell-input::-webkit-inner-spin-button,
      .ot-qty-input::-webkit-outer-spin-button,
      .ot-qty-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .ot-barter-input {
        width: 100%;
        padding: 0.5rem 0.6rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-h);
        font-size: 1.02rem;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
      }

      .ot-barter-input:focus {
        outline: none;
        border-color: var(--origin);
        background: rgba(14, 165, 233, 0.08);
      }

      .ot-barter-select {
        width: 100%;
        padding: 0.5rem 0.6rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-h);
        font-size: 1.02rem;
        font-family: inherit;
        cursor: pointer;
        min-width: 0;
        color-scheme: dark;
      }

      .ot-barter-select option {
        background: #0c0c10;
        color: #e2e8f0;
      }

      .ot-barter-select option:checked,
      .ot-barter-select option:hover {
        background: #0ea5e9;
        color: #fff;
      }

      .ot-barter-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .ot-barter-label-row .ot-barter-label {
        margin: 0;
      }

      .ot-barter-clear-btn {
        padding: 0.15rem 0.45rem;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: transparent;
        color: #94a3b8;
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
      }

      .ot-barter-clear-btn:hover {
        border-color: rgba(248, 113, 113, 0.45);
        color: #fecaca;
        background: rgba(248, 113, 113, 0.08);
      }

      .ot-barter-matrix {
        width: 100%;
        overflow-x: auto;
      }

      .ot-barter-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 1rem;
      }

      .ot-barter-table th,
      .ot-barter-table td {
        padding: 0.3rem 0.28rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        text-align: right;
        vertical-align: middle;
      }

      .ot-barter-table thead th {
        background: rgba(14, 165, 233, 0.12);
        color: var(--text-h);
        font-weight: 650;
        font-size: 0.95rem;
        text-align: center;
      }

      .ot-barter-table thead th:first-child,
      .ot-barter-table tbody th {
        width: 3.4rem;
        background: rgba(30, 41, 59, 0.75);
        color: #cbd5e1;
        font-weight: 600;
        font-size: 0.95rem;
        text-align: center;
        padding-left: 0.28rem;
        padding-right: 0.28rem;
      }

      .ot-barter-table .ot-barter-cell-input,
      .ot-barter-table .ot-barter-cell-value {
        display: block;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        min-height: 2rem;
        padding: 0.32rem 0.35rem;
        border-radius: 5px;
        font-size: 1rem;
        font-weight: 650;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
        text-align: right;
      }

      .ot-barter-table .ot-barter-cell-input {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        color: var(--text-h);
      }

      .ot-barter-table .ot-barter-cell-input:focus {
        outline: none;
        border-color: var(--origin);
        background: rgba(14, 165, 233, 0.1);
      }

      .ot-barter-table .ot-barter-cell-value {
        border: 1px solid transparent;
        background: transparent;
      }

      .ot-barter-goal {
        color: #7dd3fc;
      }

      .ot-barter-have-cell {
        vertical-align: top;
      }

      .ot-barter-have-meta {
        margin-top: 0.2rem;
        text-align: center;
        line-height: 1.35;
      }

      .ot-barter-have-line,
      .ot-barter-have-percent,
      .ot-barter-have-percent-inline {
        font-size: 0.8em;
        color: rgba(148, 163, 184, 0.75);
      }

      .ot-barter-have-percent-inline {
        font-size: 0.85em;
        color: rgba(148, 163, 184, 0.85);
      }

      .ot-barter-delta.is-short {
        color: #fca5a5;
      }

      .ot-barter-delta.is-ok {
        color: #86efac;
      }

      .ot-barter-table .ot-barter-result-col {
        border-left: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(148, 163, 184, 0.06);
      }

      .ot-barter-empty {
        flex: 1 1 100%;
        padding: 0.65rem;
        text-align: center;
        font-size: 0.95rem;
        color: rgba(148, 163, 184, 0.9);
      }

      .ot-barter-filter-btn {
        padding: 0.6rem 0.9rem;
        background: var(--origin);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 0.98rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
      }

      .ot-barter-filter-btn:hover {
        background: #0ea5e9;
      }

      /* ===== 구매수량 ===== */
      .ot-qty-panel {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-height: 0;
        flex: 1 1 auto;
      }

      .ot-qty-list {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        overflow: auto;
        min-height: 0;
        flex: 1 1 auto;
        padding-right: 0.15rem;
      }

      .ot-qty-empty {
        padding: 0.85rem 0.5rem;
        text-align: center;
        font-size: 0.95rem;
        color: rgba(148, 163, 184, 0.9);
      }

      .ot-qty-row {
        display: grid;
        grid-template-columns: 5.2rem minmax(0, 1fr);
        gap: 0.65rem;
        align-items: center;
        padding: 0.28rem 0.4rem;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.55);
      }

      .ot-qty-info {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.2rem 0.4rem;
        min-width: 0;
      }

      .ot-qty-name {
        font-size: 1.02rem;
        font-weight: 600;
        color: var(--text-h);
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }

      .ot-qty-name.is-specialty {
        display: inline-block;
        max-width: 100%;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        background: #facc15;
        border: 1px solid rgba(202, 138, 4, 0.55);
        color: #422006;
        font-weight: 700;
      }

      .ot-qty-cat {
        font-size: 0.84rem;
        color: rgba(148, 163, 184, 0.95);
        flex-shrink: 0;
      }

      .ot-qty-input {
        width: 100%;
        padding: 0.35rem 0.4rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-h);
        font-size: 1.02rem;
        font-weight: 650;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .ot-qty-input.is-peak {
        background: rgba(34, 197, 94, 0.28);
        border-color: rgba(74, 222, 128, 0.55);
        color: #ecfdf5;
      }

      .ot-qty-input.is-off {
        background: rgba(239, 68, 68, 0.28);
        border-color: rgba(248, 113, 113, 0.55);
        color: #fef2f2;
      }

      .ot-qty-input:focus {
        outline: none;
        border-color: var(--origin);
        background: rgba(14, 165, 233, 0.08);
      }

      .ot-qty-input.is-peak:focus {
        background: rgba(34, 197, 94, 0.36);
        border-color: rgba(74, 222, 128, 0.75);
      }

      .ot-qty-input.is-off:focus {
        background: rgba(239, 68, 68, 0.36);
        border-color: rgba(248, 113, 113, 0.75);
      }

      .ot-qty-status {
        margin: 0;
        min-height: 1.1em;
        font-size: 0.88rem;
        color: #86efac;
      }

      .ot-qty-status.is-error {
        color: #fca5a5;
      }

      @media (max-width: 560px) {
        .ot-toolbar-title { font-size: 0.95rem; }
        .ot-countdown { font-size: 1.9rem; }
        .ot-btn-danger { margin-left: 0; }
        .ot-view-tabs { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="ot-app">
      <header class="ot-toolbar">
        <a href="game.html" class="back-link">← 게임</a>
        <span class="ot-toolbar-title">대항오 헬퍼</span>
        <nav id="ot-view-tabs" class="ot-view-tabs" aria-label="해역 메뉴"></nav>
        <div class="ot-edit-controls">
          <button type="button" id="ot-edit-toggle" class="ot-edit-btn" aria-pressed="false">위치 수정</button>
          <button type="button" id="ot-edit-save" class="ot-edit-btn ot-edit-btn-save" hidden>저장</button>
          <button type="button" id="ot-edit-cancel" class="ot-edit-btn ot-edit-btn-cancel" hidden>취소</button>
        </div>
      </header>

      <div class="ot-main">
        <aside class="ot-side">
          <div id="ot-panel" class="ot-panel" aria-live="polite">
            <p class="ot-panel-empty">맵에서 항구를 선택하세요.</p>
          </div>

          <div class="ot-side-tools">
            <div class="ot-side-tool-tabs" role="tablist" aria-label="도구 선택">
              <button type="button" class="ot-side-tool-tab is-active" data-tool="goods" role="tab" aria-selected="true">교역품 분류</button>
              <button type="button" class="ot-side-tool-tab" data-tool="qty" role="tab" aria-selected="false">구매수량</button>
              <button type="button" class="ot-side-tool-tab" data-tool="barter" role="tab" aria-selected="false">물물교환</button>
            </div>

            <section id="ot-tool-goods" class="ot-side-tool-pane ot-goods-section" data-tool-pane="goods" role="tabpanel" aria-label="교역품 분류">
              <div id="ot-goods-cats" class="ot-goods-cats" role="group" aria-label="분류 선택"></div>
            </section>

            <section id="ot-tool-qty" class="ot-side-tool-pane" data-tool-pane="qty" role="tabpanel" aria-label="구매수량" hidden>
              <div class="ot-qty-panel">
                <div id="ot-qty-list" class="ot-qty-list" role="list"></div>
                <p id="ot-qty-status" class="ot-qty-status" aria-live="polite"></p>
              </div>
            </section>

            <section id="ot-tool-barter" class="ot-side-tool-pane" data-tool-pane="barter" role="tabpanel" aria-label="물물교환" hidden>
              <div class="ot-barter-panel">
                <div class="ot-barter-row ot-barter-row-top">
                  <div class="ot-barter-field ot-barter-field-capacity">
                    <label class="ot-barter-label" for="barter-capacity">함대 적재량</label>
                    <input type="number" id="barter-capacity" class="ot-barter-input"
                           value="5000" min="1" placeholder="적재량">
                  </div>
                  <div class="ot-barter-field">
                    <label class="ot-barter-label" for="barter-exchange">교환목록</label>
                    <select id="barter-exchange" class="ot-barter-select">
                      <option value="">선택하세요</option>
                    </select>
                  </div>
                </div>

                <div class="ot-barter-section">
                  <div class="ot-barter-label-row">
                    <p class="ot-barter-label">재료 계획</p>
                    <button type="button" id="barter-progress-clear" class="ot-barter-clear-btn">현황 초기화</button>
                  </div>
                  <div id="barter-matrix" class="ot-barter-matrix">
                    <div class="ot-barter-empty">교환목록을 선택하세요</div>
                  </div>
                </div>

                <button type="button" id="barter-filter-map" class="ot-barter-filter-btn">
                  맵에 재료 항구 표시
                </button>
              </div>
            </section>
          </div>
        </aside>

        <div class="ot-map-pane">
          <div id="ot-map" class="ot-map" aria-label="항구 맵"></div>
          <div class="ot-edit-hint" aria-hidden="true">위치 수정 모드 — 핀을 드래그한 뒤 저장하세요</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/origin-db.js"></script>
    <script src="js/origin-ports-data.js"></script>
    <script src="js/origin-ports-coords.js"></script>
    <script src="js/origin-port-goods.js"></script>
    <script src="js/origin-barter.js"></script>
    <script src="js/origin-good-qty.js"></script>
    <script src="js/origin-timer.js"></script>
  </body>
</html>
