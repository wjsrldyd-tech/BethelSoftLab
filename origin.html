<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대항오 헬퍼 · 오리진 - BethelSoftLab</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .ot-app {
        height: 100svh;
        display: flex;
        flex-direction: column;
        background: #000;
      }

      /* ===== 상단 메뉴 ===== */
      .ot-toolbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.55rem 0.85rem;
        border-bottom: 1px solid var(--border);
        background: #0c0c10;
        z-index: 20;
        min-height: 48px;
        flex-wrap: wrap;
      }

      .ot-toolbar .back-link {
        flex-shrink: 0;
        padding: 0.35rem 0.65rem;
        font-size: 0.82rem;
      }

      .ot-toolbar-title {
        flex-shrink: 0;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text-h);
        white-space: nowrap;
      }

      .ot-view-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        flex: 1 1 auto;
        min-width: 0;
      }

      .ot-view-tab {
        padding: 0.32rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text);
        font-size: 0.76rem;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
      }

      .ot-view-tab:hover {
        background: var(--bg-card-hover);
        color: var(--text-h);
      }

      .ot-view-tab.is-active {
        border-color: var(--origin);
        color: #7dd3fc;
        background: rgba(14, 165, 233, 0.12);
      }

      .ot-view-tab.has-goods {
        border-color: rgba(250, 204, 21, 0.55);
        color: #fde68a;
        background: rgba(250, 204, 21, 0.1);
      }

      .ot-view-tab.has-goods.is-active {
        border-color: #facc15;
        color: #fef08a;
        background: rgba(250, 204, 21, 0.16);
      }

      .ot-view-tab.is-dim {
        opacity: 0.45;
      }

      /* ===== 좌우 본문 =====
         맵 비율(~1024/673)에 맞는 가로폭만 오른쪽에 주고, 남은 폭은 왼쪽으로 */
      .ot-main {
        --ot-map-ar: 1.522;
        --ot-toolbar-h: 3.25rem;
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns:
          minmax(320px, 1fr)
          minmax(280px, calc((100svh - var(--ot-toolbar-h)) * var(--ot-map-ar)));
      }

      @media (max-width: 860px) {
        .ot-main {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(220px, 38%) 1fr;
        }
      }

      /* ===== 왼쪽 정보 ===== */
      .ot-side {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        min-height: 0;
        padding: 0.75rem;
        border-right: 1px solid var(--border);
        background: #0a0a0e;
        overflow: auto;
      }

      /* ===== 교역품 분류 ===== */
      .ot-goods-section {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        flex-shrink: 0;
      }

      .ot-goods-section-label {
        margin: 0;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.9);
      }

      .ot-goods-cats {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .ot-goods-cats-special {
        display: flex;
        flex-wrap: wrap;
        gap: 0.32rem;
        align-items: center;
      }

      .ot-goods-cats-normal {
        display: flex;
        flex-direction: column;
        gap: 0.28rem;
      }

      .ot-goods-cat-row {
        display: grid;
        grid-template-columns: 3.1rem repeat(5, minmax(0, 1fr));
        gap: 0.28rem;
        align-items: stretch;
      }

      .ot-goods-cat-label {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0.15rem 0.1rem;
        border-radius: 7px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(30, 41, 59, 0.65);
        color: #94a3b8;
        font-size: 0.7rem;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.02em;
        white-space: pre-line;
        user-select: none;
      }

      .ot-goods-cats-normal .ot-cat-btn {
        width: 100%;
        min-width: 0;
        padding: 0.48rem 0.2rem;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ot-cat-clear {
        margin-left: auto;
        border-color: rgba(148, 163, 184, 0.28);
        color: #94a3b8;
      }

      .ot-cat-clear:hover:not(:disabled) {
        border-color: rgba(248, 113, 113, 0.45);
        background: rgba(248, 113, 113, 0.1);
        color: #fecaca;
      }

      .ot-cat-clear:disabled,
      .ot-cat-clear.is-dim {
        opacity: 0.45;
        cursor: default;
      }

      .ot-goods-cats-divider {
        height: 1px;
        margin: 0.05rem 0;
        background: linear-gradient(90deg,
          transparent,
          rgba(148, 163, 184, 0.35) 12%,
          rgba(148, 163, 184, 0.35) 88%,
          transparent);
      }

      .ot-cat-btn {
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(15, 23, 42, 0.85);
        color: #cbd5e1;
        font-size: 0.98rem;
        font-weight: 560;
        font-family: inherit;
        cursor: pointer;
        line-height: 1.25;
        transition: border-color 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
      }

      .ot-cat-btn:hover {
        border-color: rgba(14, 165, 233, 0.45);
        color: #e2e8f0;
        background: rgba(14, 165, 233, 0.08);
      }

      .ot-cat-btn.is-active {
        border-color: rgba(14, 165, 233, 0.65);
        background: linear-gradient(160deg, rgba(14, 165, 233, 0.28), rgba(2, 132, 199, 0.16));
        color: #e0f2fe;
        box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.2), 0 4px 14px rgba(14, 165, 233, 0.12);
      }

      .ot-goods-cats-special .ot-cat-btn:not(.ot-cat-clear) {
        border-color: rgba(250, 204, 21, 0.35);
        color: #fde68a;
      }

      .ot-goods-cats-special .ot-cat-btn:not(.ot-cat-clear):hover {
        border-color: rgba(250, 204, 21, 0.55);
        background: rgba(250, 204, 21, 0.1);
        color: #fef08a;
      }

      .ot-goods-cats-special .ot-cat-btn:not(.ot-cat-clear).is-active {
        border-color: rgba(250, 204, 21, 0.7);
        background: linear-gradient(160deg, rgba(250, 204, 21, 0.28), rgba(202, 138, 4, 0.18));
        color: #fef9c3;
        box-shadow: 0 0 0 1px rgba(250, 204, 21, 0.25), 0 4px 14px rgba(250, 204, 21, 0.12);
      }

      .ot-panel {
        flex-shrink: 0;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.95rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .ot-panel.is-ready {
        border-color: var(--origin);
        box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.25);
      }

      .ot-panel.is-sold-out {
        border-color: rgba(251, 146, 60, 0.45);
        box-shadow: 0 0 0 1px rgba(251, 146, 60, 0.2);
      }

      .ot-panel-empty {
        margin: 0;
        color: var(--text);
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .ot-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .ot-head-actions {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        flex-shrink: 0;
      }

      .ot-head-actions .ot-btn {
        padding: 0.28rem 0.55rem;
        font-size: 0.74rem;
      }

      .ot-head-actions .ot-btn-danger {
        margin-left: 0;
      }

      .ot-port-name {
        margin: 0;
        display: flex;
        align-items: baseline;
        gap: 0.45rem;
        min-width: 0;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-h);
      }

      .ot-month-wrap {
        flex-shrink: 0;
        display: inline-flex;
        align-items: baseline;
        margin: 0;
        cursor: pointer;
      }

      .ot-month-select {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        padding: 0.1rem 1.1rem 0.1rem 0.15rem;
        border: 1px solid transparent;
        border-radius: 6px;
        background:
          linear-gradient(45deg, transparent 50%, #7dd3fc 50%) calc(100% - 0.55rem) calc(50% - 0.12rem) / 0.35rem 0.35rem no-repeat,
          linear-gradient(135deg, #7dd3fc 50%, transparent 50%) calc(100% - 0.32rem) calc(50% - 0.12rem) / 0.35rem 0.35rem no-repeat,
          transparent;
        color: #7dd3fc;
        font-size: 1.55rem;
        font-weight: 700;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        line-height: 1.15;
        cursor: pointer;
        outline: none;
        max-width: none;
        width: 4.85rem;
        min-width: 4.85rem;
        color-scheme: dark;
      }

      .ot-month-select:hover {
        border-color: rgba(14, 165, 233, 0.4);
        background-color: rgba(14, 165, 233, 0.1);
      }

      .ot-month-select:focus {
        border-color: var(--origin);
        box-shadow: 0 0 0 3px var(--origin-glow);
        background-color: rgba(14, 165, 233, 0.12);
      }

      .ot-month-select option {
        font-size: 0.95rem;
        font-weight: 600;
        background: #0c0c10;
        color: #e2e8f0;
      }

      .ot-month {
        flex-shrink: 0;
        font-size: 1.55rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        color: #7dd3fc;
        line-height: 1;
      }

      .ot-month-sep {
        flex-shrink: 0;
        font-size: 1.25rem;
        font-weight: 400;
        color: rgba(148, 163, 184, 0.55);
        line-height: 1;
      }

      .ot-port-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-h);
        line-height: 1.2;
      }

      .ot-season {
        flex-shrink: 0;
        margin-left: 0.15rem;
        font-size: 0.72rem;
        font-weight: 550;
        letter-spacing: 0.02em;
        color: rgba(148, 163, 184, 0.95);
        white-space: nowrap;
        line-height: 1.2;
      }

      .ot-badge {
        font-size: 0.72rem;
        padding: 0.15rem 0.45rem;
        border-radius: 999px;
        border: 1px solid rgba(14, 165, 233, 0.35);
        background: rgba(14, 165, 233, 0.12);
        color: #7dd3fc;
        white-space: nowrap;
      }

      .ot-panel.is-ready .ot-badge {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
      }

      .ot-panel.is-sold-out .ot-badge {
        border-color: rgba(251, 146, 60, 0.45);
        background: rgba(251, 146, 60, 0.14);
        color: #fdba74;
      }

      .ot-countdown-row {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .ot-countdown {
        font-size: 2.2rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        color: var(--text-h);
        line-height: 1;
        min-width: 5rem;
        flex-shrink: 0;
      }

      .ot-countdown-row .ot-min-row {
        margin-left: auto;
        flex-shrink: 0;
        align-self: center;
      }

      .ot-panel.is-ready .ot-countdown { color: #86efac; }

      .ot-synced-at {
        margin: 0;
        flex: 1 1 8rem;
        min-width: 0;
        font-size: 0.72rem;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        opacity: 0.88;
        padding-bottom: 0.12em;
      }

      .ot-meta {
        font-size: 0.84rem;
        color: var(--text);
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .ot-meta strong { color: var(--text-h); font-weight: 600; }
      .ot-hint { font-size: 0.74rem; opacity: 0.85; }

      .ot-field { display: flex; flex-direction: column; gap: 0.3rem; }

      .ot-label {
        font-size: 0.74rem;
        color: var(--text);
        font-weight: 500;
      }

      .ot-remain-edit {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }

      .ot-min-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .ot-select {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-h);
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        padding: 0.4rem 0.55rem;
        outline: none;
        min-width: 4.5rem;
        color-scheme: dark;
      }

      .ot-select option {
        background: #0c0c10;
        color: #e2e8f0;
      }

      .ot-select:focus {
        border-color: var(--origin);
        box-shadow: 0 0 0 3px var(--origin-glow);
      }

      .ot-sec-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 0.25rem;
      }

      .ot-sec-btn {
        padding: 0.4rem 0.05rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        font-size: 0.78rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        font-family: inherit;
        cursor: pointer;
        line-height: 1.1;
      }

      .ot-sec-btn:hover {
        border-color: var(--origin);
        color: #fff;
      }

      .ot-sec-btn:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .ot-actions {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin-top: 0.15rem;
      }

      .ot-actions-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.45rem;
        width: 100%;
      }

      .ot-btn {
        padding: 0.42rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-h);
        font-size: 0.82rem;
        font-family: inherit;
        cursor: pointer;
      }

      .ot-btn:hover { background: var(--bg-card-hover); }
      .ot-btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .ot-btn-primary { border-color: var(--origin); color: #7dd3fc; }
      .ot-btn-primary:hover { background: rgba(14, 165, 233, 0.12); }
      .ot-btn-accent { border-color: #f59e0b; color: #fcd34d; }
      .ot-btn-accent:hover { background: rgba(245, 158, 11, 0.12); }
      .ot-btn-enter,
      .ot-btn-visit,
      .ot-btn-tool,
      .ot-btn-shipyard {
        width: 100%;
        padding: 0.7rem 0.45rem;
        font-size: 0.92rem;
        font-weight: 650;
        letter-spacing: 0.02em;
        border-radius: 10px;
      }
      .ot-btn-enter {
        border-color: var(--origin);
        color: #7dd3fc;
      }
      .ot-btn-enter:hover { background: rgba(14, 165, 233, 0.12); }
      /* 상점 구매 — 주황 (맵 핀 is-sold-out과 동일) */
      .ot-btn-visit {
        border-color: #fb923c;
        color: #fdba74;
      }
      .ot-btn-visit:hover { background: rgba(251, 146, 60, 0.12); }
      .ot-btn-visit.is-on {
        background: rgba(251, 146, 60, 0.22);
        border-color: #fb923c;
        color: #ffedd5;
        box-shadow: inset 0 0 0 1px rgba(251, 146, 60, 0.35);
      }
      .ot-btn-visit.is-on:hover { background: rgba(251, 146, 60, 0.3); }
      /* 도구점 — 보라 (맵은 네모 핀으로 구분, 색 통일 안 함) */
      .ot-btn-tool {
        border-color: #a78bfa;
        color: #c4b5fd;
      }
      .ot-btn-tool:hover { background: rgba(167, 139, 250, 0.12); }
      .ot-btn-tool.is-on {
        background: rgba(167, 139, 250, 0.22);
        border-color: #a78bfa;
        color: #ede9fe;
        box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.35);
      }
      .ot-btn-tool.is-on:hover { background: rgba(167, 139, 250, 0.3); }
      /* 조선소 — 초록 (조 뱃지와 별도, 상점/도구점과 혼동 방지) */
      .ot-btn-shipyard {
        border-color: #4ade80;
        color: #86efac;
      }
      .ot-btn-shipyard:hover { background: rgba(74, 222, 128, 0.12); }
      .ot-btn-shipyard.is-on {
        background: rgba(74, 222, 128, 0.22);
        border-color: #4ade80;
        color: #dcfce7;
        box-shadow: inset 0 0 0 1px rgba(74, 222, 128, 0.35);
      }
      .ot-btn-shipyard.is-on:hover { background: rgba(74, 222, 128, 0.3); }
      .ot-btn-danger { border-color: rgba(248, 113, 113, 0.45); color: #fca5a5; }
      .ot-btn-danger:hover { background: rgba(248, 113, 113, 0.1); }
      .ot-btn-ghost { color: var(--text); }

      .ot-panel.is-untracked .ot-countdown {
        color: var(--text);
        opacity: 0.55;
      }

      .ot-panel.is-untracked .ot-synced-at {
        opacity: 0.55;
      }

      /* ===== 오른쪽 지도 ===== */
      .ot-map-pane {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: #12151c;
      }

      .ot-map {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0c10;
        overflow: hidden;
        container-type: size;
        touch-action: none;
        user-select: none;
      }

      .ot-map-canvas {
        position: relative;
        width: 100%;
        height: 100%;
        background: #12151c;
        overflow: visible;
      }

      .ot-map.has-image .ot-map-canvas {
        flex: 0 1 auto;
        width: min(100%, calc(100cqh * var(--map-ar, 1.7)));
        height: min(100%, calc(100cqw / var(--map-ar, 1.7)));
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: var(--map-ar, 16 / 9);
        background-color: #1a2030;
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.45);
      }

      .ot-map-label {
        position: absolute;
        top: 0.65rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: 0.72rem;
        font-weight: 600;
        color: rgba(226, 232, 240, 0.85);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        background: rgba(10, 12, 16, 0.55);
        padding: 0.2rem 0.55rem;
        border-radius: 4px;
      }

      .ot-pin {
        position: absolute;
        transform: translate(-50%, -100%);
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        font-family: inherit;
        color: inherit;
      }

      .ot-pin-marker {
        width: 12px;
        height: 12px;
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        background: #94a3b8;
        border: 2px solid #e2e8f0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      .ot-pin.is-tracked .ot-pin-marker {
        background: #0ea5e9;
        border-color: #7dd3fc;
      }

      .ot-pin.is-ready .ot-pin-marker {
        background: #22c55e;
        border-color: #86efac;
      }

      .ot-pin.is-sold-out .ot-pin-marker {
        background: #fb923c;
        border-color: #fdba74;
      }

      /* 도구점 구매: 핀 → 더 큰 둥근 네모 (구분용) */
      .ot-pin.is-tool-shop .ot-pin-marker {
        width: 16px;
        height: 16px;
        border-radius: 3px;
        transform: none;
      }

      .ot-pin.is-active .ot-pin-marker {
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.5);
      }

      .ot-pin-name {
        margin-top: 3px;
        font-size: 0.95rem;
        font-weight: 650;
        color: #f5f5f7;
        white-space: nowrap;
        background: #1a1c24;
        padding: 0.2rem 0.5rem;
        border-radius: 5px;
        border: 1px solid #3a3a44;
        display: inline-flex;
        align-items: center;
        gap: 0.28rem;
      }

      /* 조선소 조 뱃지 — 구매 전 흐림 / 구매 후 상점·도구점과 동일 주황 */
      .ot-pin-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.25em;
        height: 1.35em;
        padding: 0 0.28rem;
        border-radius: 4px;
        font-size: 0.92em;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0;
      }

      .ot-pin-badge-jo {
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: rgba(71, 85, 105, 0.35);
        color: #94a3b8;
      }

      .ot-pin-badge-jo.is-bought {
        border-color: rgba(251, 146, 60, 0.7);
        background: rgba(251, 146, 60, 0.28);
        color: #fdba74;
      }

      .ot-pin-time {
        font-size: 0.84rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #7dd3fc;
        background: #1a1c24;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        border: 1px solid #2a2a32;
      }

      .ot-pin.is-ready .ot-pin-time { color: #86efac; }
      .ot-pin.is-sold-out .ot-pin-time { color: #fdba74; }
      .ot-pin:hover .ot-pin-name { border-color: var(--origin); color: #fff; }

      /* 분류 필터 ON — 이름|타이머 + 아래 품목 */
      .ot-map.is-goods-filter .ot-pin.is-goods-focus {
        z-index: 8;
        gap: 0.2rem;
      }

      /* 필터 ON: 기본은 추적(하늘) 강조. 구매/리셋 상태는 일반 맵과 동일 우선순위 유지 */
      .ot-map.is-goods-filter .ot-pin-marker {
        width: 14px;
        height: 14px;
        background: #0ea5e9;
        border-color: #7dd3fc;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.35), 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .ot-map.is-goods-filter .ot-pin:not(.is-tracked) .ot-pin-marker {
        background: #94a3b8;
        border-color: #e2e8f0;
        box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.3), 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .ot-map.is-goods-filter .ot-pin.is-ready .ot-pin-marker {
        background: #22c55e;
        border-color: #86efac;
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35), 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .ot-map.is-goods-filter .ot-pin.is-sold-out .ot-pin-marker {
        background: #fb923c;
        border-color: #fdba74;
        box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.35), 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .ot-map.is-goods-filter .ot-pin.is-tool-shop .ot-pin-marker {
        width: 18px;
        height: 18px;
        border-radius: 3px;
        transform: none;
      }

      .ot-pin-good.is-shipyard-mat {
        border-color: rgba(251, 146, 60, 0.4);
        color: #fdba74;
      }

      .ot-pin-head {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 0.25rem;
        max-width: 11rem;
      }

      .ot-map.is-goods-filter .ot-pin-name {
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.12rem 0.4rem;
        background: rgba(15, 18, 24, 0.92);
        border-color: rgba(14, 165, 233, 0.45);
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ot-map.is-goods-filter .ot-pin-time {
        font-size: 0.74rem;
        padding: 0.1rem 0.35rem;
        flex-shrink: 0;
      }

      .ot-pin-goods {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.12rem;
        min-width: 0;
        margin-top: 0.05rem;
      }

      .ot-pin-good {
        font-size: 0.76rem;
        font-weight: 550;
        line-height: 1.2;
        text-align: center;
        white-space: nowrap;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(30, 41, 59, 0.75);
        color: #cbd5e1;
        box-shadow: none;
      }

      /* 수량 색 = 시즌 (평시=품명색 / 성수 초록 / 비수 빨강). 수량 없으면 미표시 */
      .ot-pin-good-qty {
        margin-left: 0.28rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: inherit;
      }

      .ot-pin-good-qty.is-peak {
        color: #4ade80;
      }

      .ot-pin-good-qty.is-off {
        color: #f87171;
      }

      .ot-pin-good.is-specialty .ot-pin-good-qty.is-peak {
        color: #15803d;
      }

      .ot-pin-good.is-specialty .ot-pin-good-qty.is-off {
        color: #b91c1c;
      }

      .ot-pin-good.is-specialty {
        background: #facc15;
        border-color: rgba(202, 138, 4, 0.55);
        color: #422006;
        font-weight: 700;
      }

      .ot-map.is-edit-mode .ot-pin {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .ot-map.is-edit-mode .ot-pin.is-dragging {
        cursor: grabbing;
        z-index: 20;
        opacity: 0.92;
      }

      .ot-map.is-edit-mode .ot-pin.is-dragging .ot-pin-name {
        border-color: #f59e0b;
        color: #fef3c7;
      }

      .ot-edit-hint {
        display: none;
        position: absolute;
        bottom: 0.7rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9;
        padding: 0.4rem 0.85rem;
        border-radius: 6px;
        border: 1px solid rgba(245, 158, 11, 0.45);
        background: rgba(30, 24, 12, 0.92);
        color: #fbbf24;
        font-size: 0.8rem;
        font-weight: 600;
        pointer-events: none;
        white-space: nowrap;
      }

      .ot-map-pane.is-edit-mode .ot-edit-hint { display: block; }

      .ot-edit-controls {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin-left: auto;
        flex-shrink: 0;
      }

      .ot-edit-btn {
        padding: 0.35rem 0.7rem;
        font-size: 0.8rem;
        font-weight: 600;
        font-family: inherit;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-h);
        cursor: pointer;
      }

      .ot-edit-btn:hover {
        border-color: var(--origin);
        background: rgba(14, 165, 233, 0.1);
      }

      .ot-edit-btn.is-active {
        border-color: #f59e0b;
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
      }

      .ot-edit-btn-save {
        border-color: rgba(34, 197, 94, 0.45);
        color: #86efac;
      }

      .ot-edit-btn-cancel {
        border-color: rgba(248, 113, 113, 0.4);
        color: #fca5a5;
      }

      .ot-edit-btn[hidden] { display: none; }

      /* ===== 설정 패널 ===== */
      .ot-settings-overlay {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 0.75rem;
        background: rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(4px);
      }

      .ot-settings-overlay[hidden] {
        display: none !important;
      }

      .ot-settings-panel {
        width: min(520px, 100%);
        max-height: calc(100svh - 1.5rem);
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        padding: 1rem 1.05rem 1.15rem;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: #0f172a;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        overflow: auto;
      }

      .ot-settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .ot-settings-title {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-h);
      }

      .ot-settings-close {
        padding: 0.3rem 0.65rem;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: transparent;
        color: #94a3b8;
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
      }

      .ot-settings-close:hover {
        color: #fecaca;
        border-color: rgba(248, 113, 113, 0.45);
      }

      .ot-settings-section {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        padding: 0.85rem 0.9rem;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.65);
      }

      .ot-settings-section-title {
        margin: 0;
        font-size: 0.98rem;
        font-weight: 650;
        color: #e2e8f0;
      }

      .ot-settings-hint {
        margin: 0;
        font-size: 0.86rem;
        line-height: 1.45;
        color: rgba(148, 163, 184, 0.95);
      }

      .ot-settings-row {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 0.55rem 0.75rem;
      }

      .ot-settings-field {
        display: flex;
        flex-direction: column;
        gap: 0.28rem;
        min-width: 0;
        flex: 1 1 10rem;
      }

      .ot-settings-label {
        font-size: 0.88rem;
        font-weight: 600;
        color: rgba(203, 213, 225, 0.95);
      }

      .ot-settings-input {
        width: 100%;
        padding: 0.45rem 0.55rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-h);
        font-size: 1.02rem;
        font-weight: 650;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
      }

      .ot-settings-input:focus {
        outline: none;
        border-color: var(--origin);
        background: rgba(14, 165, 233, 0.08);
      }

      .ot-settings-save {
        padding: 0.45rem 0.9rem;
        border-radius: 8px;
        border: 1px solid rgba(14, 165, 233, 0.45);
        background: rgba(14, 165, 233, 0.16);
        color: #7dd3fc;
        font-size: 0.92rem;
        font-weight: 650;
        font-family: inherit;
        cursor: pointer;
        flex-shrink: 0;
      }

      .ot-settings-save:hover {
        background: rgba(14, 165, 233, 0.28);
      }

      .ot-settings-save:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .ot-settings-status {
        margin: 0;
        min-height: 1.1em;
        font-size: 0.86rem;
        color: #86efac;
      }

      .ot-settings-status.is-error {
        color: #fca5a5;
      }

      .ot-settings-status.is-warn {
        color: #fcd34d;
      }

      .ot-settings-check {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0;
        font-size: 0.9rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        user-select: none;
      }

      .ot-settings-check input {
        width: 1.05rem;
        height: 1.05rem;
        accent-color: #0ea5e9;
        cursor: pointer;
      }

      .ot-settings-check.is-disabled,
      .ot-settings-field.is-disabled,
      .ot-settings-row.is-disabled {
        opacity: 0.45;
        pointer-events: none;
      }

      .ot-settings-offset-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .ot-settings-offset-btn {
        min-width: 2.4rem;
        padding: 0.35rem 0.45rem;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(255, 255, 255, 0.04);
        color: #cbd5e1;
        font-size: 0.85rem;
        font-weight: 650;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }

      .ot-settings-offset-btn:hover {
        border-color: rgba(14, 165, 233, 0.5);
        color: #7dd3fc;
        background: rgba(14, 165, 233, 0.1);
      }

      .ot-settings-offset-btns.is-disabled {
        opacity: 0.45;
        pointer-events: none;
      }

      .ot-settings-offset-btn.is-current {
        border-color: rgba(14, 165, 233, 0.55);
        color: #7dd3fc;
        background: rgba(14, 165, 233, 0.16);
      }

      /* ===== 교역품 / 물물교환 탭 ===== */
      .ot-side-tools {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        flex: 1 1 auto;
        min-height: 0;
      }

      .ot-side-tool-tabs {
        display: flex;
        gap: 0.25rem;
        padding: 0.2rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        flex-shrink: 0;
      }

      .ot-side-tool-tab {
        flex: 1 1 0;
        padding: 0.5rem 0.3rem;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-size: 0.95rem;
        font-weight: 560;
        font-family: inherit;
        cursor: pointer;
      }

      .ot-side-tool-tab:hover {
        color: var(--text-h);
        background: rgba(255, 255, 255, 0.05);
      }

      .ot-side-tool-tab.is-active {
        background: rgba(14, 165, 233, 0.18);
        color: #7dd3fc;
        font-weight: 600;
      }

      .ot-side-tool-pane[hidden] {
        display: none !important;
      }

      .ot-side-tool-pane {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        flex: 1 1 auto;
        min-height: 0;
      }

      /* ===== 물물교환 패널 ===== */
      .ot-barter-panel {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .ot-barter-section {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .ot-barter-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
        gap: 0.55rem;
        align-items: end;
      }

      .ot-barter-row-top {
        grid-template-columns: minmax(5.5rem, 7.5rem) minmax(0, 1fr);
        align-items: start;
      }

      .ot-barter-field-exchanges {
        min-width: 0;
      }

      .ot-barter-exchange-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .ot-barter-exchange-item {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }

      .ot-barter-shipment-cb {
        width: 0.95rem;
        height: 0.95rem;
        margin: 0;
        flex-shrink: 0;
        cursor: pointer;
        accent-color: #0ea5e9;
      }

      .ot-barter-exchange-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.28rem;
        padding: 0.4rem 0.65rem;
        border-radius: 7px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(255, 255, 255, 0.05);
        color: #e2e8f0;
        font-size: 0.88rem;
        font-weight: 650;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
      }

      .ot-barter-exchange-btn:hover {
        border-color: rgba(14, 165, 233, 0.5);
        color: #7dd3fc;
        background: rgba(14, 165, 233, 0.1);
      }

      .ot-barter-exchange-btn.is-active {
        border-color: rgba(14, 165, 233, 0.6);
        background: rgba(14, 165, 233, 0.22);
        color: #7dd3fc;
        box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.25);
      }

      .ot-barter-field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }

      .ot-barter-label {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(203, 213, 225, 0.95);
      }

      .ot-barter-input,
      .ot-barter-cell-input,
      .ot-qty-input {
        -moz-appearance: textfield;
      }

      .ot-barter-input::-webkit-outer-spin-button,
      .ot-barter-input::-webkit-inner-spin-button,
      .ot-barter-cell-input::-webkit-outer-spin-button,
      .ot-barter-cell-input::-webkit-inner-spin-button,
      .ot-qty-input::-webkit-outer-spin-button,
      .ot-qty-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .ot-barter-input {
        width: 100%;
        padding: 0.5rem 0.6rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-h);
        font-size: 1.02rem;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
      }

      .ot-barter-input:focus {
        outline: none;
        border-color: var(--origin);
        background: rgba(14, 165, 233, 0.08);
      }

      .ot-barter-select {
        width: 100%;
        padding: 0.5rem 0.6rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-h);
        font-size: 1.02rem;
        font-family: inherit;
        cursor: pointer;
        min-width: 0;
        color-scheme: dark;
      }

      .ot-barter-select-wrap {
        position: relative;
        min-width: 0;
      }

      .ot-barter-select-wrap .ot-barter-select {
        padding-left: 2.7rem;
      }

      .ot-barter-select-wrap .ot-cat-badge {
        position: absolute;
        left: 0.55rem;
        top: 50%;
        z-index: 1;
        transform: translateY(-50%);
        pointer-events: none;
      }

      .ot-barter-select option {
        background: #0c0c10;
        color: #e2e8f0;
      }

      .ot-barter-select option:checked,
      .ot-barter-select option:hover {
        background: #0ea5e9;
        color: #fff;
      }

      .ot-barter-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .ot-barter-label-row .ot-barter-label {
        margin: 0;
      }

      .ot-barter-mult-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 0.28rem;
        align-items: center;
        margin-right: auto;
      }

      .ot-barter-mult-btn {
        min-width: 1.85rem;
        height: 1.85rem;
        padding: 0 0.35rem;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: rgba(255, 255, 255, 0.04);
        color: #cbd5e1;
        font-size: 0.9rem;
        font-weight: 650;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        line-height: 1;
      }

      .ot-barter-mult-btn:hover {
        border-color: rgba(14, 165, 233, 0.5);
        color: #e2e8f0;
        background: rgba(14, 165, 233, 0.1);
      }

      .ot-barter-mult-btn.is-active {
        border-color: rgba(14, 165, 233, 0.75);
        background: rgba(14, 165, 233, 0.22);
        color: #f8fafc;
      }

      .ot-barter-clear-btn {
        padding: 0.15rem 0.45rem;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: transparent;
        color: #94a3b8;
        font-size: 0.88rem;
        font-family: inherit;
        cursor: pointer;
      }

      .ot-barter-clear-btn:hover {
        border-color: rgba(248, 113, 113, 0.45);
        color: #fecaca;
        background: rgba(248, 113, 113, 0.08);
      }

      .ot-barter-matrix {
        width: 100%;
        overflow-x: auto;
      }

      .ot-barter-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 1rem;
      }

      .ot-barter-table th,
      .ot-barter-table td {
        padding: 0.3rem 0.28rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        text-align: right;
        vertical-align: middle;
      }

      .ot-barter-table thead th {
        background: rgba(14, 165, 233, 0.12);
        color: var(--text-h);
        font-weight: 650;
        font-size: 0.95rem;
        text-align: center;
      }

      .ot-barter-table thead th:not(:first-child) {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        max-width: 0;
      }

      .ot-barter-table thead th:first-child,
      .ot-barter-table tbody th {
        width: 3.4rem;
        background: rgba(30, 41, 59, 0.75);
        color: #cbd5e1;
        font-weight: 600;
        font-size: 0.95rem;
        text-align: center;
        padding-left: 0.28rem;
        padding-right: 0.28rem;
      }

      .ot-barter-table .ot-barter-cell-input,
      .ot-barter-table .ot-barter-cell-value {
        display: block;
        width: 100%;
        max-width: 100%;

          <section class="ot-settings-section" aria-labelledby="ot-settings-drift-title">
            <h3 id="ot-settings-drift-title" class="ot-settings-section-title">타이머 보정</h3>

            <label class="ot-settings-check" for="ot-settings-drift-enabled">
              <input type="checkbox" id="ot-settings-drift-enabled" checked>
              선형 보정 사용
            </label>
            <div class="ot-settings-row" id="ot-settings-drift-row">
              <div class="ot-settings-field">
                <label class="ot-settings-label" for="ot-settings-drift-over">N분 (분당 보정 기준)</label>
                <input type="number" id="ot-settings-drift-over" class="ot-settings-input"
                  min="60" max="100000" step="10" value="1200" inputmode="numeric">
              </div>
            </div>
            <div class="ot-settings-offset-btns" id="ot-settings-drift-history" role="group" aria-label="N분 최근 값"></div>

            <label class="ot-settings-check" for="ot-settings-offset-enabled">
              <input type="checkbox" id="ot-settings-offset-enabled" checked>
              전역 영점 사용
            </label>
            <div class="ot-settings-row" id="ot-settings-offset-row">
              <div class="ot-settings-field">
                <label class="ot-settings-label" for="ot-settings-offset-sec">영점 (초)</label>
                <input type="number" id="ot-settings-offset-sec" class="ot-settings-input"
                  min="-120" max="120" step="1" value="0" inputmode="numeric">
              </div>
            </div>
            <div class="ot-settings-offset-btns" id="ot-settings-offset-btns" role="group" aria-label="영점 빠른 조절">
              <button type="button" class="ot-settings-offset-btn" data-offset-delta="-10">-10</button>
              <button type="button" class="ot-settings-offset-btn" data-offset-delta="-5">-5</button>
              <button type="button" class="ot-settings-offset-btn" data-offset-delta="-1">-1</button>
              <button type="button" class="ot-settings-offset-btn" data-offset-delta="1">+1</button>
              <button type="button" class="ot-settings-offset-btn" data-offset-delta="5">+5</button>
              <button type="button" class="ot-settings-offset-btn" data-offset-delta="10">+10</button>
              <button type="button" class="ot-settings-offset-btn" data-offset-set="0">0</button>
            </div>

            <p id="ot-settings-status" class="ot-settings-status" aria-live="polite"></p>
          </section>

          <section class="ot-settings-section" aria-labelledby="ot-settings-barter-title">
            <h3 id="ot-settings-barter-title" class="ot-settings-section-title">물물교환</h3>
            <div class="ot-settings-row">
              <div class="ot-settings-field">
                <label class="ot-settings-label" for="ot-settings-capacity">함대 적재량</label>
                <input type="number" id="ot-settings-capacity" class="ot-settings-input"
                  min="1" step="1" value="5000" inputmode="numeric">
              </div>
            </div>
          </section>
        </div>
      </div>

      <div id="ot-sales-overlay" class="ot-settings-overlay" hidden>
        <div class="ot-settings-panel ot-sales-panel" role="dialog" aria-modal="true" aria-labelledby="ot-sales-title">
          <div class="ot-settings-head">
            <h2 id="ot-sales-title" class="ot-settings-title">판매 기록</h2>
            <button type="button" id="ot-sales-close" class="ot-settings-close">닫기</button>
          </div>

          <section class="ot-settings-section ot-sales-form-section">
            <div class="ot-sales-form-row">
              <div class="ot-sales-form-info">
                <span id="ot-sales-good" class="ot-sales-info-text is-empty">교환목록 선택</span>
                <span class="ot-sales-separator">→</span>
                <span id="ot-sales-port" class="ot-sales-info-text is-empty">항구 선택</span>
              </div>
              <div class="ot-sales-form-inputs">
                <input type="number" id="ot-sales-market" class="ot-sales-input" 
                  min="1" max="999" step="1" placeholder="시세%" inputmode="decimal">
                <input type="number" id="ot-sales-price" class="ot-sales-input"
                  min="1" step="1" placeholder="판매가" inputmode="decimal">
                <div class="ot-sales-unit-display">
                  <span class="ot-sales-unit-label">단가</span>
                  <strong id="ot-sales-unit" class="ot-sales-unit-value">—</strong>
                </div>
                <button type="button" id="ot-sales-save" class="ot-sales-save-btn">저장</button>
              </div>
            </div>
            <p id="ot-sales-status" class="ot-sales-status" aria-live="polite"></p>
          </section>

          <div class="ot-sales-body">
            <section class="ot-settings-section ot-sales-col" aria-labelledby="ot-sales-best-title">
              <div class="ot-sales-list-head">
                <h3 id="ot-sales-best-title" class="ot-sales-list-title">품목별 최고가</h3>
              </div>
              <div class="ot-sales-list-wrap">
                <div class="ot-sales-best-header">
                  <div class="ot-sales-header-cell">품목</div>
                  <div class="ot-sales-header-cell is-number">단가</div>
                  <div class="ot-sales-header-cell">항구</div>
                </div>
                <div id="ot-sales-best-list" class="ot-sales-list"></div>
              </div>
            </section>

            <section class="ot-settings-section ot-sales-col" aria-labelledby="ot-sales-recent-title">
              <div class="ot-sales-list-head">
                <h3 id="ot-sales-recent-title" class="ot-sales-list-title">최근 기록</h3>
                <button type="button" id="ot-sales-filter-clear" class="ot-sales-filter-clear" hidden>전체</button>
              </div>
              <div class="ot-sales-list-wrap">
                <div class="ot-sales-header">
                  <div class="ot-sales-header-cell">품목명</div>
                  <div class="ot-sales-header-cell">판매처</div>
                  <div class="ot-sales-header-cell is-number">시세</div>
                  <div class="ot-sales-header-cell is-number">판매가</div>
                  <div class="ot-sales-header-cell is-number">단가</div>
                  <div class="ot-sales-header-cell is-number">시간</div>
                  <div class="ot-sales-header-cell"></div>
                </div>
                <div id="ot-sales-list" class="ot-sales-list"></div>
              </div>
            </section>
          </div>
        </div>
      </div>

      <div class="ot-main">
        <aside class="ot-side">
          <div id="ot-panel" class="ot-panel" aria-live="polite">
            <p class="ot-panel-empty">맵에서 항구를 선택하세요.</p>
          </div>

          <div class="ot-side-tools">
            <div class="ot-side-tool-tabs" role="tablist" aria-label="도구 선택">
              <button type="button" class="ot-side-tool-tab is-active" data-tool="qty" role="tab" aria-selected="true">구매수량</button>
              <button type="button" class="ot-side-tool-tab" data-tool="goods" role="tab" aria-selected="false">교역품</button>
              <button type="button" class="ot-side-tool-tab" data-tool="barter" role="tab" aria-selected="false">물물교환</button>
              <button type="button" class="ot-side-tool-tab" data-tool="shipyard" role="tab" aria-selected="false">조선</button>
              <button type="button" class="ot-side-tool-tab" data-tool="recommend" role="tab" aria-selected="false">추천</button>
            </div>

            <section id="ot-tool-qty" class="ot-side-tool-pane" data-tool-pane="qty" role="tabpanel" aria-label="구매수량">
              <div class="ot-qty-panel">
                <div id="ot-qty-list" class="ot-qty-list" role="list"></div>
                <p id="ot-qty-status" class="ot-qty-status" aria-live="polite"></p>
              </div>
            </section>

            <section id="ot-tool-goods" class="ot-side-tool-pane ot-goods-section" data-tool-pane="goods" role="tabpanel" aria-label="교역품" hidden>
              <div id="ot-goods-cats" class="ot-goods-cats" role="group" aria-label="분류 선택"></div>
            </section>

            <section id="ot-tool-barter" class="ot-side-tool-pane" data-tool-pane="barter" role="tabpanel" aria-label="물물교환" hidden>
              <div class="ot-barter-panel">
                <div class="ot-barter-row ot-barter-row-top">
                  <div class="ot-barter-field ot-barter-field-village">
                    <label class="ot-barter-label" for="barter-village">마을</label>
                    <select id="barter-village" class="ot-barter-select">
                      <option value="">선택하세요</option>
                    </select>
                  </div>
                  <div class="ot-barter-field ot-barter-field-exchanges">
                    <span class="ot-barter-label" id="barter-exchange-label">교환목록</span>
                    <div id="barter-exchange-btns" class="ot-barter-exchange-btns" role="group" aria-labelledby="barter-exchange-label"></div>
                  </div>
                </div>

                <div class="ot-barter-section">
                  <div class="ot-barter-label-row">
                    <p class="ot-barter-label">재료 계획</p>
                    <div id="barter-mult-btns" class="ot-barter-mult-btns" role="group" aria-label="교환 횟수 배수">
                      <button type="button" class="ot-barter-mult-btn" data-mult="1" aria-pressed="false">1</button>
                      <button type="button" class="ot-barter-mult-btn" data-mult="2" aria-pressed="false">2</button>
                      <button type="button" class="ot-barter-mult-btn" data-mult="3" aria-pressed="false">3</button>
                      <button type="button" class="ot-barter-mult-btn" data-mult="4" aria-pressed="false">4</button>
                      <button type="button" class="ot-barter-mult-btn" data-mult="5" aria-pressed="false">5</button>
                      <button type="button" class="ot-barter-mult-btn" data-mult="6" aria-pressed="false">6</button>
                      <button type="button" class="ot-barter-mult-btn" data-mult="7" aria-pressed="false">7</button>
                      <button type="button" class="ot-barter-mult-btn" data-mult="8" aria-pressed="false">8</button>
                    </div>
                    <button type="button" id="barter-progress-clear" class="ot-barter-clear-btn">현황 초기화</button>
                  </div>
                  <div id="barter-matrix" class="ot-barter-matrix">
                    <div class="ot-barter-empty">교환목록을 선택하세요</div>
                  </div>
                </div>

                <div class="ot-barter-actions">
                  <div id="barter-result-btns" class="ot-barter-result-btns" role="group" aria-label="맵 표시 결과물"></div>
                  <button type="button" id="barter-filter-map" class="ot-barter-filter-btn"
                    aria-pressed="false">
                    맵에 재료 항구 표시
                  </button>
                  <button type="button" id="barter-sales-open" class="ot-barter-filter-btn ot-barter-sales-btn">
                    판매 기록
                  </button>
                </div>
              </div>
            </section>

            <section id="ot-tool-shipyard" class="ot-side-tool-pane" data-tool-pane="shipyard" role="tabpanel" aria-label="조선" hidden>
              <div class="ot-shipyard-panel">
                <p id="ot-shipyard-reset-meta" class="ot-shipyard-reset-meta">매주 월요일 00:00 (KST) 리셋</p>
                <div class="ot-goods-cats">
                  <div class="ot-goods-cats-special ot-shipyard-toolbar" role="group" aria-label="필터 공통">
                    <button type="button" id="ot-shipyard-select-all" class="ot-cat-btn"
                      aria-pressed="false" aria-label="전체선택">전체선택</button>
                    <button type="button" id="ot-shipyard-clear" class="ot-cat-btn ot-cat-clear is-dim" disabled
                      aria-label="필터 해제">필터 해제</button>
                  </div>
                  <div class="ot-goods-cats-divider" aria-hidden="true"></div>
                  <div id="ot-shipyard-tiers" class="ot-shipyard-tiers ot-goods-cats-normal" role="group" aria-label="조선 티어"></div>
                </div>
              </div>
            </section>

            <section id="ot-tool-recommend" class="ot-side-tool-pane" data-tool-pane="recommend" role="tabpanel" aria-label="추천" hidden>
              <div class="ot-recommend-panel">
                <div class="ot-goods-cats">
                  <div class="ot-goods-cats-special" role="group" aria-label="필터 공통">
                    <button type="button" id="ot-recommend-clear" class="ot-cat-btn ot-cat-clear is-dim" disabled
                      aria-label="필터 해제">필터 해제</button>
                  </div>
                  <div class="ot-goods-cats-divider" aria-hidden="true"></div>
                  <div id="ot-recommend-routes" class="ot-recommend-routes ot-goods-cats-normal" role="group" aria-label="추천 루트"></div>
                </div>
              </div>
            </section>
          </div>
        </aside>

        <div class="ot-map-pane">
          <div id="ot-map" class="ot-map" aria-label="항구 맵"></div>
          <div class="ot-edit-hint" aria-hidden="true">위치 수정 모드 — 핀을 드래그한 뒤 저장하세요</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/origin-db.js"></script>
    <script src="js/origin-ports-data.js"></script>
    <script src="js/origin-ports-coords.js"></script>
    <script src="js/origin-port-goods.js"></script>
    <script src="js/origin-recommend.js"></script>
    <script src="js/origin-shipyard.js"></script>
    <script src="js/origin-barter.js"></script>
    <script src="js/origin-barter-sales.js"></script>
    <script src="js/origin-good-qty.js"></script>
    <script src="js/origin-timer.js"></script>
  </body>
</html>
